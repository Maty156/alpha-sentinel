<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA Sentinel</title>
<link rel="icon" href="data:,">
<!-- shell only: styles and scripts are separate files (CSP script-src 'self').
     No inline style or script elements, and no on* handler, anywhere. -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5l8-3z"/>
        <circle cx="12" cy="11" r="3.2"/>
        <path d="M12 4.6v2.2M12 15.2v2.2M5.6 11h2.2M16.2 11h2.2"/>
      </svg>
      <span class="brand-name">Alpha Sentinel</span>
    </div>

    <nav class="nav" aria-label="pages">
      <a class="nav-item" href="#/overview" data-page="overview"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nav-label">Overview</span></a>
      <a class="nav-item" href="#/alerts" data-page="alerts"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3L12 3z"/><path d="M12 9v4M12 16.5v.5"/></svg><span class="nav-label">Alerts</span><span class="nav-count" id="alertCount" hidden></span></a>
      <a class="nav-item" href="#/assets" data-page="assets"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="nav-label">Assets</span></a>
      <a class="nav-item" href="#/rules" data-page="rules"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.4-2.9 8.2-7 9.5-4.1-1.3-7-5.1-7-9.5V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span class="nav-label">Detection Rules</span></a>

      <!-- not built yet: rendered, greyed, not clickable, no route -->
      <span class="nav-item disabled" aria-disabled="true"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8 16.5L16 7.5"/></svg><span class="nav-label">Attack Paths</span><span class="nav-soon">Soon</span></span>

      <span class="nav-item disabled" aria-disabled="true"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg><span class="nav-label">Reports</span><span class="nav-soon">Soon</span></span>
      <a class="nav-item" href="#/settings" data-page="settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/></svg><span class="nav-label">Settings</span></a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Collapse or expand the sidebar" aria-label="Toggle sidebar">&#9776;</button>
      <div class="topbar-title">
        <h1 id="pageTitle">Security Overview</h1>
        <span class="page-sub" id="pageSub"></span>
      </div>
      <span class="spacer"></span>
      <span id="demoPill" hidden></span>
      <span id="healthPill"></span>
      <label class="caption" for="search" hidden>Search</label>
      <input class="field" id="search" type="search" placeholder="Search this page..." aria-label="Search this page" autocomplete="off">
      <!-- the range is fixed: the API serves the last 24 hours, and it is not a setting -->
      <select class="field" id="range" title="The dashboard always shows the last 24 hours" aria-label="Time range">
        <option>Last 24 hours</option>
      </select>
      <span class="pill"><span class="dot"></span><span id="whoami">signed in</span></span>
      <button class="btn btn-sm" id="logout" type="button">Logout</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- load order: helpers, then pages, then the boot script -->
<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/router.js"></script>
<script src="/js/pages/overview.js"></script>
<script src="/js/pages/alerts.js"></script>
<script src="/js/pages/rules.js"></script>
<script src="/js/pages/events.js"></script>
<script src="/js/pages/chains.js"></script>
<script src="/js/pages/assets.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
